name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:yaml -- --all
      - run: npm test
      - run: node --test integrations/notion/test/*.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: integrations/slack
      - run: npm test
        working-directory: integrations/slack
